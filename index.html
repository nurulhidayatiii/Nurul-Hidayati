<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Nurul Hidayati</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!-- Card Biodata -->
                <div class="card shadow-sm border-0">
                    
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">BIODATA MAHASISWA</h3>
                    </div>

                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <div class="bg-primary text-white rounded-circle 
                                        d-flex align-items-center justify-content-center 
                                        mx-auto"
                                 style="width: 100px; height: 100px;">
                                <span class="fs-1">N</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama</label>
                            <div class="form-control bg-light">
                                Nurul Hidayati
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Kelas / Program Studi</label>
                            <div class="form-control bg-light">
                                Komputerisasi Akuntansi
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Semester</label>
                            <div class="form-control bg-light">
                                Semester 1
                            </div>
                        </div>

                    </div>

                    <div class="card-footer text-center text-muted">
                        <small>Data Biodata Mahasiswa</small>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
